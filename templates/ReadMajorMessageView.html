<!DOCTYPE html>
<html>
<head>
    <title>Read Message</title>
</head>
<body>
    <center>
        <h2>Decrypt Message</h2>
        <p>The decryption key has been sent to your email.</p>
        <form action="ReadMajorMessage" method="post">
            {% csrf_token %}
            <table>
                <tr>
                    <td>Message ID</td>
                    <td><input type="text" name="t1" value="{{ msg_id }}" readonly></td>
                </tr>
                <tr>
                    <td>Enter Key</td>
                    <td><input type="text" name="t2" required></td>
                </tr>
                <tr>
                    <td></td>
                    <td><input type="submit" value="Decrypt"></td>
                </tr>
            </table>
        </form>
    </center>
</body>
</html>
